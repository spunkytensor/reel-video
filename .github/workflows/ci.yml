name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: Real CPU API, media and frontend checks (no model execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ci/requirements.txt
            requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r ci/requirements.txt
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Python contracts and real FFmpeg encode/decode
        run: sh ci/python.sh
      - name: Browser against the real HTTP server and SQLite (worker disabled)
        run: npm test
      - name: Set up cached runtime builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact native runtime (no weights)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: reel-video:ci
          pull: true
          # Separate writers prevent the parallel audit from replacing this cache.
          cache-from: type=gha,scope=runtime-ci-amd64
          cache-to: type=gha,scope=runtime-ci-amd64,mode=max
      - name: Test the exact native runtime (CPU only, no weights)
        run: sh ci/runtime.sh reel-video:ci
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-ci-evidence
          path: outputs/ci/
          if-no-files-found: error
